name: Weekly Link Check

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # binance.com and trocador.app are bot-protected: they answer 202/503
      # to CI runners but load fine in a browser, so they are excluded
      # rather than reported as broken every week. abank.kg serves a
      # valid Amazon cert but omits the intermediate, which browsers
      # fetch automatically and lychee's stricter TLS stack rejects.
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,202,204,206,301,302,307,308,403,503
            --timeout 30
            --max-retries 3
            --exclude 'tornadocash.eth.link'
            --exclude 'binance.com'
            --exclude 'trocador.app'
            --exclude 'abank.kg'
            --exclude 'localhost'
            --exclude '127.0.0.1'
            README.md
          fail: false

      - name: Read lychee output
        id: results
        run: |
          # lychee exits non-zero when it found broken links (fail: false keeps
          # the job green so we can report via an issue instead).
          if [ "${{ steps.lychee.outputs.exit_code }}" = "0" ]; then
            echo "broken=false" >> $GITHUB_OUTPUT
          else
            echo "broken=true" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for broken links
        if: steps.results.outputs.broken == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if there's already an open issue for broken links
          EXISTING=$(gh issue list --label "dead-link" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null || echo "")

          # Build the body in a file so the report is inserted verbatim
          # (no shell expansion) and without block-scalar indentation, which
          # would otherwise render the whole report as a code block.
          {
            echo "## Weekly Link Check — $(date +%Y-%m-%d)"
            echo
            echo "The automated link checker found broken or unreachable URLs in the directory."
            echo
            echo "<details>"
            echo "<summary>Full report</summary>"
            echo
            cat ./lychee/out.md 2>/dev/null || echo "No detailed output available."
            echo
            echo "</details>"
            echo
            echo "---"
            echo "*This issue was created automatically by the weekly link checker.*"
          } > /tmp/link-check-body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/link-check-body.md
          else
            gh issue create \
              --title "Broken links detected — $(date +%Y-%m-%d)" \
              --body-file /tmp/link-check-body.md \
              --label "dead-link,maintenance"
          fi
